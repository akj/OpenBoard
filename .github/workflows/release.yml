name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the tag to match package metadata
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('pyproject.toml', 'rb') as metadata:
              expected = 'v' + tomllib.load(metadata)['project']['version']
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Release tag {actual} does not match project version {expected}')
          PY

  checks:
    name: Test and package release
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      build-installers: true

  publish:
    name: Publish release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: openboard-*
          merge-multiple: true
          path: release-files
      - name: Create checksums for the downloadable files
        working-directory: release-files
        run: sha256sum -- * > SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenBoard ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
          body: |
            Installers are available for Windows, macOS, and Linux. Portable archives contain the app and its bundled dependencies. Stockfish is installed separately.

            `SHA256SUMS` contains checksums for every downloadable archive and installer.
